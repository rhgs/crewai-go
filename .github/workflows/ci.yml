name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build (including examples)
        run: go build ./...

      - name: go test (with race detector)
        run: go test -race ./...

      - name: go test (coverage)
        run: |
          # Exclude examples/ (demo mains) so Codecov reflects library code.
          pkgs=$(go list ./... | grep -v '/examples')
          go test -coverprofile=coverage.out -covermode=atomic $pkgs
          go tool cover -func=coverage.out | tail -n 1
          # Fail the job if total coverage drops below 90%.
          total=$(go tool cover -func=coverage.out | awk '/total:/{print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN{ if (t+0 < 90.0) { printf("coverage %.1f%% is below 90%%\n", t); exit 1 } }'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: unittests
          name: crewai-go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
